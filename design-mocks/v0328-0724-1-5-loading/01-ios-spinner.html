<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading State A — iOS Spinner (split-bill-calculator)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    background: #fafafa;
    color: #171717;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* iOS chrome */
  .status-bar {
    height: 44px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    color: #171717;
  }
  .status-bar .time { font-variant-numeric: tabular-nums; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons svg { width: 16px; height: 16px; fill: #171717; }
  .home-indicator {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(0, 0, 0, 0.85);
    border-radius: 3px;
  }
  /* Page chrome (navbar) */
  .navbar {
    height: 48px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
  }
  .navbar .title { font-size: 17px; font-weight: 600; }
  .navbar .nav-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .navbar .nav-icon svg { width: 22px; height: 22px; stroke: #6366f1; }
  /* Main container */
  main {
    height: calc(100% - 44px - 48px - 8px);
    overflow-y: auto;
    padding: 16px;
  }
  /* Page loading overlay — full screen takeover */
  .loading-overlay {
    position: absolute;
    inset: 44px 0 0 0;
    background: rgba(250, 250, 250, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  /* Option A: iOS Material indeterminate spinner */
  .spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid rgba(99, 102, 241, 0.18);
    border-top-color: #6366f1;
    animation: spin 800ms cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 14px;
    font-weight: 500;
    color: #4338ca;
    letter-spacing: -0.005em;
  }
  /* Skeleton list behind overlay (showing what's loading) */
  .skeleton-list {
    list-style: none;
    width: 100%;
    max-width: 358px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0.4;
  }
  .skeleton-card {
    height: 110px;
    background: linear-gradient(90deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0.6) 100%);
    background-size: 200% 100%;
    border: 1.5px solid rgba(255, 255, 255, 0.78);
    border-radius: 18px;
    animation: shimmer 1.4s ease-in-out infinite;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.07);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  /* prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: #6366f1; }
    .skeleton-card { animation: none; }
  }
</style>
</head>
<body>
  <!-- iOS status bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons">
      <svg viewBox="0 0 24 24"><path d="M2 22h2v-8H2v8zm4 0h2V10H6v12zm4 0h2V6h-2v16zm4 0h2V2h-2v20zm4-16v16h2V6h-2z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 3C7 3 2.73 4.84 0 7.78L12 22l12-14.22C21.27 4.84 17 3 12 3zm0 5a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15 0H9v2h6V0zm-4 22h6v-2h-6v2zm8-4V6c0-2.21-1.79-4-4-4h-4c-2.21 0-4 1.79-4 4v12H4l1 1h14l1-1h-3z"/></svg>
    </span>
  </div>

  <!-- Navbar (visible during loading) -->
  <nav class="navbar">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    </div>
    <span class="title">账本详情</span>
    <div class="nav-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>
    </div>
  </nav>

  <!-- Main: skeleton list behind loading overlay -->
  <main>
    <ul class="skeleton-list">
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
      <li class="skeleton-card"></li>
    </ul>
  </main>

  <!-- Loading overlay (Option A: iOS indeterminate spinner) -->
  <div class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">加载账单...</div>
  </div>

  <!-- iOS home indicator -->
  <div class="home-indicator"></div>
</body>
</html>
