[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "split-bill-calculator-backend"
version = "0.1.0"
description = "Split Bill Calculator — FastAPI backend (multi-user, multi-session, SQLite)"
readme = { text = "split-bill-calculator backend (FastAPI + SQLAlchemy + SQLite).", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Jesse Jia", email = "jessejia1001@gmail.com" },
]
keywords = ["split-bill", "fastapi", "sqlite", "saas"]

# NOTE: project.urls MUST be http(s) URLs — NEVER local paths.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "aiosqlite>=0.20.0",
    "aiosmtplib>=3.0.1",
    "httpx>=0.27.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://gitea.jessejia.click:433/jessejia/split-bill-calculator"
Repository = "https://gitea.jessejia.click:433/jessejia/split-bill-calculator.git"
Issues = "https://gitea.jessejia.click:433/jessejia/split-bill-calculator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]