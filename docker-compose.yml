# SplitIt docker-compose (optional self-host sketch)
#
# Services:
#   - backend / frontend share one image today (see Dockerfile + entrypoint).
#     Prefer splitting processes before production use.
#   - cloudflared: optional tunnel sidecar when TUNNEL_TOKEN is set.
#
# Data: SQLite bind-mounted at ./backend/data

version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: split-bill-calculator:latest
    container_name: sbc-backend
    command: ["/app/entrypoint.sh"]
    expose:
      - "8449"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/.env:/app/backend/.env:ro
    environment:
      - SBC_ENV=production
      - SBC_SKIP_SEED=true
      - SBC_SKIP_TEST_TRUNCATE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8449/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sbc-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: split-bill-calculator:latest
    container_name: sbc-frontend
    command: ["/app/entrypoint.sh"]
    ports:
      - "8448:8448"
    expose:
      - "8449"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/.env:/app/backend/.env:ro
    environment:
      - SBC_ENV=production
      - SBC_SKIP_SEED=true
      - SBC_SKIP_TEST_TRUNCATE=1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sbc-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sbc-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - sbc-net
    profiles:
      - tunnel

networks:
  sbc-net:
    driver: bridge
