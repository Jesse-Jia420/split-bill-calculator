<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Brand / PWA -->
    <title>轻均 FairLite</title>
    <meta name="application-name" content="轻均 FairLite" />
    <meta name="description" content="极简分账，一链即平。旅行，合租，聚餐，随手分享记账，AA 不再烦恼" />
    <meta name="theme-color" content="#0c302e" />
    <meta name="color-scheme" content="light" />

    <!-- iOS Add to Home Screen: glass landing icon + standalone chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="轻均" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" sizes="192x192" />

    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/icons/icon-192.png" sizes="192x192" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
