<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>v0.3.18 #67 CURRENT — SessionCard v0.3.18 #64 (PO: 颜色太过鲜艳)</title>
  <style>
    :root {
      /* matches app.css */
      --accent-700: #1d4ed8;
      --gray-500: #737373;
      --gray-700: #404040;
      --gray-900: #171717;
      --space-2: 8px;
      --transition: 240ms ease-out;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #f0f5ff 0%, #e0e7ff 100%);
      color: var(--gray-900);
      font-family: 'Inter Variable', system-ui, -apple-system, BlinkMacSystemFont,
        'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .ios-chrome {
      width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .ios-statusbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px 0 24px;
      font-size: 15px;
      font-weight: 600;
      color: #000;
      letter-spacing: -0.2px;
    }
    .ios-statusbar .time { font-variant-numeric: tabular-nums; }
    .ios-statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .ios-statusbar .icon { width: 16px; height: 11px; display: inline-block; }

    .ios-homeindicator {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ios-homeindicator::after {
      content: "";
      width: 134px;
      height: 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.85);
    }

    .annotation {
      padding: 6px 18px 8px;
      font-size: 11px;
      color: #be123c;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: rgba(254, 226, 226, 0.65);
      border-bottom: 1px solid rgba(190, 18, 60, 0.20);
    }
    .annotation .swatch {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 4px;
      background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(168,85,247,0.25), rgba(59,130,246,0.30));
    }

    .page-head {
      padding: 8px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-head h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111827;
    }
    .page-head .user {
      font-size: 13px;
      color: var(--gray-500);
    }

    .stack {
      padding: 4px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    /* ===== v0.3.18 #64 CURRENT implementation (faithful copy from SessionCard.svelte) ===== */
    .session-card {
      background: linear-gradient(
        135deg,
        rgba(99, 102, 241, 0.22) 0%,
        rgba(168, 85, 247, 0.25) 50%,
        rgba(59, 130, 246, 0.30) 100%
      );
      backdrop-filter: saturate(220%) blur(28px);
      -webkit-backdrop-filter: saturate(220%) blur(28px);

      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      padding: 18px;

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 1px 4px rgba(99, 102, 241, 0.08),
        0 4px 16px rgba(99, 102, 241, 0.06);

      transition:
        box-shadow 240ms ease-out,
        transform 240ms ease-out,
        border-color 240ms ease-out;
    }

    .card-link:hover .session-card {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 4px 12px rgba(99, 102, 241, 0.16),
        0 8px 32px rgba(99, 102, 241, 0.10),
        0 0 0 3px rgba(99, 102, 241, 0.10);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent-700);
      letter-spacing: -0.01em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .role {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
      color: var(--gray-500);
      border: 1px solid rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
      line-height: 1.3;
    }
    .role.owner {
      padding: 4px 10px;
      background: linear-gradient(
        135deg,
        rgba(99, 102, 241, 0.85) 0%,
        rgba(59, 130, 246, 0.85) 100%
      );
      color: white;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 1px 3px rgba(99, 102, 241, 0.3);
    }
    .meta {
      margin-top: 10px;
      display: flex;
      gap: var(--space-2);
      font-size: 13px;
      line-height: 1.4;
    }
    .dot {
      color: var(--gray-500);
    }
    .muted {
      color: var(--gray-500);
    }

    @media (min-width: 720px) {
      .ios-chrome { width: 768px; }
      .page-head h1 { font-size: 34px; }
      .stack { padding: 6px 24px 32px; gap: 16px; }
      .session-card { padding: 22px; border-radius: 22px; }
      .title { font-size: 19px; }
    }

    @media (max-width: 340px) {
      .ios-chrome { width: 320px; }
      .page-head { padding: 6px 14px 12px; }
      .page-head h1 { font-size: 24px; }
      .stack { padding: 4px 10px 16px; gap: 10px; }
      .session-card { padding: 14px; border-radius: 16px; }
      .title { font-size: 15.5px; }
    }
  </style>
</head>
<body>
